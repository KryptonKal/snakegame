<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game with Sound Effects</title>
     <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
         }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
         }

         .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
         }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
         }

         .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
            font-size: 1.2rem;
         }

         .score-board span {
            font-weight: bold;
         }

         #gameCanvas {
            display: block;
            margin: 0 auto;
            border-radius: 10px;
            background: #f5f5f5;
         }

         .controls {
            text-align: center;
            margin-top: 25px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
         }

         .controls p {
            color: #666;
            margin-bottom: 10px;
            font-size: 0.95rem;
         }

         .key-hint {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 5px;
            margin: 0 3px;
            font-size: 0.85rem;
            font-weight: bold;
         }

         #gameOver {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px 60px;
            border-radius: 15px;
            text-align: center;
            font-size: 2rem;
            z-index: 1000;
         }

         #gameOver h2 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            color: #ff6b6b;
         }

         .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
         }

         .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
         }

         #restartBtn {
            display: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
         }

         #restartBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
         }

         canvas {
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
         }

         .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            z-index: 999;
         }

         .sound-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
         }
     </style>
</head>
<body>
    <button class="sound-toggle" onclick="toggleSound()">🔊 Sound: ON</button>
    
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        
        <div class="score-board">
            <span>Score: <span id="score">0</span></span>
            <span>High Score: <span id="highScore">0</span></span>
        </div>

        <canvas id="gameCanvas" width="600" height="400"></canvas>

        <div class="controls">
            <p>Use arrow keys to control the snake:</p>
            <p>
                <span class="key-hint">↑</span>
                <span class="key-hint">↓</span>
                <span class="key-hint">←</span>
                <span class="key-hint">→</span>
            </p>
            <p>Press <strong>Enter</strong> or <strong>Space</strong> to restart after game over</p>
        </div>

        <button id="restartBtn" class="btn-restart" onclick="location.reload()">Play Again</button>
    </div>

    <div id="gameOver">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="location.reload()" class="btn-restart">Play Again</button>
    </div>

    <script>
        // Game Configuration
        const gridSize = 20;
        const tileCountX = 30;
        const tileCountY = 20;
        const gameSpeed = 100; // ms per frame

        // Game State Variables
        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let isGameOver = false;
        let soundEnabled = true;

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Sound Effects - Using AudioContext for no external dependencies
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (!soundEnabled) return;
            
            // Ensure audio context is running (user interaction required in modern browsers)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                switch(type) {
                    case 'eat':
                        // Pleasant ding sound for eating food
                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.1);
                        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                        oscillator.start(audioCtx.currentTime);
                        oscillator.stop(audioCtx.currentTime + 0.1);
                        break;
                    
                    case 'crash':
                        // Dramatic crash sound
                        oscillator.type = 'sawtooth';
                        oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                        gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                        oscillator.start(audioCtx.currentTime);
                        oscillator.stop(audioCtx.currentTime + 0.3);
                        break;
                    
                    case 'turn':
                        // Subtle sound for direction changes
                        oscillator.type = 'triangle';
                        oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                        oscillator.start(audioCtx.currentTime);
                        oscillator.stop(audioCtx.currentTime + 0.05);
                        break;
                }
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        // Initialize Game
        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            document.getElementById('score').textContent = score;
            spawnFood();
            isGameOver = false;
            
            if (gameLoop) clearTimeout(gameLoop);
            gameLoop = setTimeout(gameUpdate, gameSpeed);
        }

        // Spawn Food at Random Position
        function spawnFood() {
            do {
                food.x = Math.floor(Math.random() * tileCountX);
                food.y = Math.floor(Math.random() * tileCountY);
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        // Update Game State
        function gameUpdate() {
            if (isGameOver) return;

            // Get current direction from queue
            direction = nextDirection;

            const head = { ...snake[0] };

            // Move based on direction
            switch(direction) {
                case 'right':
                    head.x += 1;
                    break;
                case 'left':
                    head.x -= 1;
                    break;
                case 'up':
                    head.y -= 1;
                    break;
                case 'down':
                    head.y += 1;
                    break;
            }

            // Check Wall Collision
            if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
                gameOver();
                return;
            }

            // Check Self Collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // Add new head
            snake.unshift(head);

            // Check Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                
                // Save High Score
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    document.getElementById('highScore').textContent = highScore;
                }

                playSound('eat');
                spawnFood();
            } else {
                snake.pop();
            }

            drawGame();
            
            if (!isGameOver) {
                gameLoop = setTimeout(gameUpdate, gameSpeed);
            }
        }

        // Draw Game
        function drawGame() {
            // Clear Canvas
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid (optional - for visual reference)
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            
            for (let i = 0; i <= tileCountX; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
            }

            for (let j = 0; j <= tileCountY; j++) {
                ctx.beginPath();
                ctx.moveTo(0, j * gridSize);
                ctx.lineTo(canvas.width, j * gridSize);
                ctx.stroke();
            }

            // Draw Snake
            snake.forEach((segment, index) => {
                // Gradient colors for snake body
                const isHead = index === 0;
                const gradient = isHead ? 
                    'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' :
                    'linear-gradient(135deg, #4a3b8c 0%, #5d4ca9 100%)';
                
                ctx.fillStyle = gradient;
                if (isHead) {
                    ctx.shadowColor = '#667eea';
                    ctx.shadowBlur = 10;
                } else {
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                }
                
                // Draw rounded rectangle for snake segment
                const padding = 2;
                ctx.beginPath();
                ctx.roundRect(
                    segment.x * gridSize + padding,
                    segment.y * gridSize + padding,
                    gridSize - padding * 2,
                    gridSize - padding * 2,
                    isHead ? 8 : 4
                );
                ctx.fill();

                // Draw eyes on head
                if (isHead) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 5;
                    let eyeX1, eyeY1, eyeX2, eyeY2;
                    
                    switch(direction) {
                        case 'right':
                            eyeX1 = segment.x * gridSize + gridSize - 8;
                            eyeY1 = segment.y * gridSize + 5;
                            eyeX2 = segment.x * gridSize + gridSize - 8;
                            eyeY2 = segment.y * gridSize + gridSize - 8;
                            break;
                        case 'left':
                            eyeX1 = segment.x * gridSize + 3;
                            eyeY1 = segment.y * gridSize + 5;
                            eyeX2 = segment.x * gridSize + 3;
                            eyeY2 = segment.y * gridSize + gridSize - 8;
                            break;
                        case 'up':
                            eyeX1 = segment.x * gridSize + 5;
                            eyeY1 = segment.y * gridSize + 3;
                            eyeX2 = segment.x * gridSize + gridSize - 8;
                            eyeY2 = segment.y * gridSize + 3;
                            break;
                        case 'down':
                            eyeX1 = segment.x * gridSize + 5;
                            eyeY1 = segment.y * gridSize + gridSize - 8;
                            eyeX2 = segment.x * gridSize + gridSize - 8;
                            eyeY2 = segment.y * gridSize + gridSize - 3;
                            break;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, eyeSize/2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw Food
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 15;
            
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize/2,
                food.y * gridSize + gridSize/2,
                gridSize/2 - 3,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // Draw Pulse Animation on Food
            ctx.fillStyle = 'rgba(255, 107, 107, 0.6)';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize/2,
                food.y * gridSize + gridSize/2,
                gridSize/2 - 3,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        // Game Over
        function gameOver() {
            isGameOver = true;
            clearTimeout(gameLoop);
            
            playSound('crash');
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
            
            const gameContainer = document.querySelector('.game-container');
            gameContainer.style.cursor = 'not-allowed';
        }

        // Sound Toggle Function
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.querySelector('.sound-toggle');
            btn.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
        }

        // Keyboard Controls - Single Event Listener
        document.addEventListener('keydown', (e) => {
            const keyMap = {
                'ArrowUp': direction !== 'down' ? () => { nextDirection = 'up'; playSound('turn'); } : null,
                'ArrowDown': direction !== 'up' ? () => { nextDirection = 'down'; playSound('turn'); } : null,
                'ArrowLeft': direction !== 'right' ? () => { nextDirection = 'left'; playSound('turn'); } : null,
                'ArrowRight': direction !== 'left' ? () => { nextDirection = 'right'; playSound('turn'); } : null,
                ' ': initGame,
                'Enter': initGame
            };

            const handler = keyMap[e.key];
            if (handler) {
                e.preventDefault();
                handler();
            }
        });

        // Restart Button
        document.getElementById('restartBtn').addEventListener('click', () => {
            location.reload();
        });

        // Start Game on Page Load
        initGame();

        // Draw initial state
        drawGame();
    </script>
</body>
</html>
